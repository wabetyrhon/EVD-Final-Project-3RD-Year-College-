<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <!-- Tailwind CSS for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- PyScript Core CSS & JS (Latest Version) -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="flex h-screen bg-gray-100">
        <!-- Sidebar Navigation -->
        <div class="w-64 bg-white shadow-md">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-800">Admin Panel</h2>
            </div>
            <nav class="mt-6">
                <a href="#" id="nav-products" class="block py-2 px-6 text-gray-700 hover:bg-gray-200">Manage Products</a>
                <a href="#" id="nav-reservations" class="block py-2 px-6 text-gray-700 hover:bg-gray-200">Manage Reservations</a>
            </nav>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-hidden">
            <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-gray-800" id="section-title">Manage Products</h1>
                <a href="/logout" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm">Logout</a>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                
                <!-- Error Banner -->
                <div id="error-banner" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span id="error-message" class="block sm:inline"></span>
                </div>

                <!-- 1. Products Section -->
                <div id="products-section" class="space-y-6">
                    <h2 class="text-2xl font-bold text-gray-800">Product Management</h2>
                    
                    <!-- Add/Edit Product Form -->
                    <div class="bg-white p-6 rounded shadow">
                        <h3 class="text-lg font-semibold mb-4" id="product-form-title">Add New Product</h3>
                        <input type="hidden" id="product-id">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="prod-name" placeholder="Product Name" class="border p-2 rounded">
                            <input type="text" id="prod-unit" placeholder="Unit (e.g., kg, pcs)" class="border p-2 rounded">
                            <input type="number" step="0.01" id="prod-price" placeholder="Price" class="border p-2 rounded">
                            
                            <!-- Categories Dropdown populated from /api/categories -->
                            <select id="prod-category" class="border p-2 rounded">
                                <option value="">Select Category</option>
                            </select>
                            
                            <input type="text" id="prod-img" placeholder="Image URL" class="border p-2 rounded col-span-2">
                        </div>
                        <div class="mt-4 flex space-x-3">
                            <button id="save-product-btn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Product</button>
                            <button id="cancel-edit-btn" class="hidden bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</button>
                        </div>
                    </div>

                    <!-- Products Table -->
                    <div class="bg-white rounded shadow overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Image URL</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Price</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Unit</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="products-table-body" class="bg-white divide-y divide-gray-200">
                                <!-- Populated dynamically by PyScript -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 2. Reservations Section -->
                <div id="reservations-section" class="space-y-6 hidden">
                    <h2 class="text-2xl font-bold text-gray-800">Reservation Management</h2>
                    <div class="bg-white rounded shadow overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Res ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Customer</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Pickup Date</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="reservations-table-body" class="bg-white divide-y divide-gray-200">
                                <!-- Populated dynamically by PyScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- PyScript Logic -->
    <script type="py">
        import asyncio
        from pyscript import document
        from pyscript.ffi import create_proxy
        import js
        import json

        def show_error(msg):
            banner = document.getElementById("error-banner")
            message_span = document.getElementById("error-message")
            message_span.innerText = msg
            banner.classList.remove("hidden")

        def clear_error():
            banner = document.getElementById("error-banner")
            banner.classList.add("hidden")

        def show_section(section_name, event=None):
            if event is not None:
                event.preventDefault()
            prod_sec = document.getElementById("products-section")
            res_sec = document.getElementById("reservations-section")
            title = document.getElementById("section-title")
            
            prod_sec.classList.add("hidden")
            res_sec.classList.add("hidden")
            
            if section_name == "products":
                prod_sec.classList.remove("hidden")
                title.innerText = "Manage Products"
            elif section_name == "reservations":
                res_sec.classList.remove("hidden")
                title.innerText = "Manage Reservations"

        document.getElementById("nav-products").addEventListener("click", create_proxy(lambda e: show_section("products", e)))
        document.getElementById("nav-reservations").addEventListener("click", create_proxy(lambda e: show_section("reservations", e)))

        async def api_fetch(url, method="GET", body=None):
            init = js.Object.new()
            init.method = method
            
            headers = js.window.Headers.new()
            headers.set("Content-Type", "application/json")
            init.headers = headers
            
            if body is not None:
                init.body = json.dumps(body)
            
            response = await js.window.fetch(url, init)
            return response

        async def load_categories():
            try:
                response = await api_fetch("/api/categories")
                if response.ok:
                    data = await response.json()
                    categories = data.to_py() if hasattr(data, "to_py") else data
                    select = document.getElementById("prod-category")
                    select.innerHTML = '<option value="">Select Category</option>'
                    for cat in categories:
                        opt = document.createElement("option")
                        opt.value = str(cat["category_id"])
                        opt.text = cat["name"]
                        select.appendChild(opt)
            except Exception as e:
                print(f"Error loading categories: {e}")

        async def load_products():
            try:
                response = await api_fetch("/api/products")
                if response.ok:
                    data = await response.json()
                    products = data.to_py() if hasattr(data, "to_py") else data
                    tbody = document.getElementById("products-table-body")
                    tbody.innerHTML = ""
                    for p in products:
                        tr = document.createElement("tr")
                        tr.innerHTML = f"""
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 truncate max-w-xs">{p['img_url'] or 'N/A'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{p['name']}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${p['price']}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{p['unit']}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button class="text-indigo-600 hover:text-indigo-900 mr-3 edit-btn" data-id="{p['product_id']}" data-name="{p['name']}" data-unit="{p['unit']}" data-price="{p['price']}" data-category="{p['category_id']}" data-img="{p['img_url']}">Edit</button>
                                <button class="text-red-600 hover:text-red-900 delete-prod-btn" data-id="{p['product_id']}" data-name="{p['name']}">Delete</button>
                            </td>
                        """
                        tbody.appendChild(tr)
                    
                    for btn in tbody.getElementsByClassName("edit-btn"):
                        pid = int(btn.getAttribute("data-id"))
                        name = btn.getAttribute("data-name")
                        unit = btn.getAttribute("data-unit")
                        price = float(btn.getAttribute("data-price"))
                        cat_id = int(btn.getAttribute("data-category"))
                        img_url = btn.getAttribute("data-img")
                        
                        def make_edit_handler(pid, name, unit, price, cat_id, img_url):
                            return lambda e: populate_edit(pid, name, unit, price, cat_id, img_url)
                        
                        btn.addEventListener("click", create_proxy(make_edit_handler(pid, name, unit, price, cat_id, img_url)))

                    for btn in tbody.getElementsByClassName("delete-prod-btn"):
                        pid = int(btn.getAttribute("data-id"))
                        pname = btn.getAttribute("data-name")
                        def make_delete_handler(pid, pname):
                            return lambda e: asyncio.ensure_future(confirm_and_delete_product(pid, pname))
                        btn.addEventListener("click", create_proxy(make_delete_handler(pid, pname)))

            except Exception as e:
                print(f"Error loading products: {e}")

        async def load_reservations():
            try:
                response = await api_fetch("/api/reservations")
                if response.ok:
                    data = await response.json()
                    reservations = data.to_py() if hasattr(data, "to_py") else data
                    tbody = document.getElementById("reservations-table-body")
                    tbody.innerHTML = ""
                    for r in reservations:
                        tr = document.createElement("tr")
                        tr.innerHTML = f"""
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{r['reservation_id']}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{r['customer_name']}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{r['customer_email']}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{r['pickup_date'] or 'N/A'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button class="text-red-600 hover:text-red-900 delete-res-btn" data-id="{r['reservation_id']}">Delete</button>
                            </td>
                        """
                        tbody.appendChild(tr)

                    for btn in tbody.getElementsByClassName("delete-res-btn"):
                        rid = btn.getAttribute("data-id")
                        def make_delete_res_handler(rid):
                            return lambda e: asyncio.ensure_future(delete_reservation(rid))
                        btn.addEventListener("click", create_proxy(make_delete_res_handler(rid)))

            except Exception as e:
                print(f"Error loading reservations: {e}")

        async def save_product(event):
            clear_error()
            pid = document.getElementById("product-id").value
            name = document.getElementById("prod-name").value
            unit = document.getElementById("prod-unit").value
            price = document.getElementById("prod-price").value
            category_id = document.getElementById("prod-category").value
            img_url = document.getElementById("prod-img").value

            if not name or not unit or not price or not category_id:
                show_error("Please fill out all required fields, including selecting a category.")
                return

            try:
                parsed_category_id = int(category_id)
            except ValueError:
                show_error("Please select a valid category.")
                return

            payload = {
                "name": name,
                "unit": unit,
                "price": float(price),
                "category_id": parsed_category_id,
                "img_url": img_url
            }

            if pid:
                response = await api_fetch(f"/api/products/{pid}", method="PUT", body=payload)
            else:
                response = await api_fetch("/api/products", method="POST", body=payload)

            if response.ok:
                reset_product_form()
                await load_products()
            else:
                err_data = await response.json()
                show_error(f"Failed to save product: {err_data}")

        async def confirm_and_delete_product(pid, pname):
            if js.window.confirm(f"Are you sure you want to delete product '{pname}'?"):
                response = await api_fetch(f"/api/products/{pid}", method="DELETE")
                if response.ok:
                    await load_products()

        async def delete_reservation(rid):
            if js.window.confirm("Are you sure you want to delete this reservation?"):
                response = await api_fetch(f"/api/reservations/{rid}", method="DELETE")
                if response.ok:
                    await load_reservations()

        def populate_edit(pid, name, unit, price, category_id, img_url):
            document.getElementById("product-id").value = str(pid)
            document.getElementById("prod-name").value = name
            document.getElementById("prod-unit").value = unit
            document.getElementById("prod-price").value = str(price)
            document.getElementById("prod-category").value = str(category_id)
            document.getElementById("prod-img").value = img_url
            document.getElementById("product-form-title").innerText = f"Edit {name}"
            document.getElementById("cancel-edit-btn").classList.remove("hidden")

        def reset_product_form(event=None):
            if event is not None:
                event.preventDefault()
            document.getElementById("product-id").value = ""
            document.getElementById("prod-name").value = ""
            document.getElementById("prod-unit").value = ""
            document.getElementById("prod-price").value = ""
            document.getElementById("prod-category").value = ""
            document.getElementById("prod-img").value = ""
            document.getElementById("product-form-title").innerText = "Add New Product"
            document.getElementById("cancel-edit-btn").classList.add("hidden")
            clear_error()

        document.getElementById("save-product-btn").addEventListener("click", create_proxy(lambda e: asyncio.ensure_future(save_product(e))))
        document.getElementById("cancel-edit-btn").addEventListener("click", create_proxy(reset_product_form))

        async def init():
            await load_categories()
            await load_products()
            await load_reservations()

        asyncio.ensure_future(init())
    </script>
</body>
</html>
