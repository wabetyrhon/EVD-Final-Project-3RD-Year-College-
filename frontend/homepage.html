<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laortealbe - Fresh and Cheap</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <!-- Brand Logo -->
            <img src="logo.png" alt="Laortealbe Logo" class="h-10 w-auto object-contain">
        </div>
        <div>
            <a href="/login" class="text-xs uppercase tracking-wider font-semibold text-gray-600 hover:text-green-700 transition">Admin Portal</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="max-w-3xl w-full text-center space-y-6">
            
            <!-- Centered Large Logo -->
            <div class="flex justify-center mb-4">
                <img src="logo.png" alt="Laortealbe Logo" class="h-28 w-auto object-contain drop-shadow-sm">
            </div>

            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 tracking-tight">
                Quality Meat, <span class="text-green-700">Fresh and Cheap</span>
            </h1>
            
            <p class="text-lg text-gray-600 max-w-xl mx-auto">
                Welcome to Laortealbe! Reserve your preferred cuts online for quick and convenient pickup, or track your active order status effortlessly.
            </p>

            <!-- Call to Action Buttons -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
                <!-- Button to Customer Reservation / Tracking Page -->
                <a href="/customer" class="bg-green-700 hover:bg-green-800 text-white font-medium py-3 px-8 rounded-lg shadow transition text-center text-sm">
                    Make or Track Reservation
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 Laortealbe. All rights reserved.
    </footer>

</body>
</html>
